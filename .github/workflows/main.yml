name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    name: Lint
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "4.0"
          bundler-cache: true
      - name: RuboCop
        run: bundle exec rubocop
      - name: Verify gem builds
        run: gem build phlex-reactive.gemspec --strict

  test:
    runs-on: ubuntu-latest
    name: Ruby ${{ matrix.ruby }}
    strategy:
      fail-fast: false
      matrix:
        ruby:
          - "3.4"
          - "4.0"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true
      - name: Unit + request + generator specs
        run: bundle exec rspec spec/phlex spec/requests spec/generators

  bench:
    runs-on: ubuntu-latest
    name: Benchmarks (report only)
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
          bundler-cache: true
      # Run + report: this job NEVER fails the build on a perf regression
      # (continue-on-error). It exists to surface throughput/allocation trends
      # over time as an artifact, not to gate merges on a flaky threshold (shared
      # CI runners are too noisy for a hard cutoff). Read the numbers on the PR.
      - name: Micro-benchmarks
        id: micro
        continue-on-error: true
        run: bundle exec rake bench:micro
      - name: Request-cycle benchmark (derailed)
        continue-on-error: true
        run: bundle exec rake bench:request | tee tmp/benchmarks/request.txt
      - name: Upload benchmark report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: benchmarks
          path: tmp/benchmarks/*.txt
          if-no-files-found: warn

  site:
    runs-on: ubuntu-latest
    name: Demo site (${{ matrix.server }})
    # The docs/ Rails app is a separate app that dogfoods the gem via
    # `path: ".."`. Run its request + system suites under BOTH real servers,
    # plus its RuboCop, so the showcase can't rot. `rake lint` is used (not bare
    # `rubocop`) because the gem's ancestor .rubocop.yml excludes docs/**/* — a
    # bare run would lint zero files.
    strategy:
      fail-fast: false
      matrix:
        server:
          - puma
          - falcon
    defaults:
      run:
        working-directory: docs
    env:
      RAILS_ENV: test
      HEADLESS: "true"
      CAPYBARA_SERVER: ${{ matrix.server }}
      PLAYWRIGHT_BROWSERS_PATH: /home/runner/.cache/ms-playwright
      # The app depends on the gem via `path: ".."`, and the gem's gemspec lists
      # files with `git ls-files`. Every commit changes that file list, so the
      # path-gem's gemspec digest never matches a previously-committed lock —
      # which makes bundler's frozen/deployment mode (forced by bundler-cache)
      # fail with "the gemspecs for path gems changed". Disable frozen for this
      # app; the lock is still respected, just allowed to update the path entry.
      BUNDLE_FROZEN: "false"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
          bundler-cache: true
          working-directory: docs
      - uses: oven-sh/setup-bun@v2
      - name: Install JS dependencies
        run: bun install --frozen-lockfile
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: docs-playwright-${{ runner.os }}-${{ hashFiles('docs/bun.lock') }}
          restore-keys: |
            docs-playwright-${{ runner.os }}-
      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: bunx --bun playwright install chromium chromium-headless-shell
      - name: Install Playwright system dependencies
        run: sudo bunx --bun playwright install-deps chromium 2>/dev/null || true
      - name: Prepare database
        run: bin/rails db:test:prepare
      - name: Build daisyUI/Tailwind CSS
        run: bun run build:css
      - name: RuboCop
        if: matrix.server == 'puma'
        run: bundle exec rake lint
      - name: Request specs
        run: bundle exec rspec spec/requests
      - name: System specs
        run: bundle exec rspec spec/system

  system:
    runs-on: ubuntu-latest
    name: System (${{ matrix.server }})
    # Run the browser suite under BOTH real web servers — Puma (sync, thread-pool)
    # and Falcon (async, fiber-per-request) — so a reactive round trip is proven
    # transport-agnostic. CAPYBARA_SERVER selects the server (see
    # spec/system/support/capybara_setup.rb).
    strategy:
      fail-fast: false
      matrix:
        server:
          - puma
          - falcon
    env:
      RAILS_ENV: test
      HEADLESS: "true"
      CAPYBARA_SERVER: ${{ matrix.server }}
      PLAYWRIGHT_BROWSERS_PATH: /home/runner/.cache/ms-playwright
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "4.0"
          bundler-cache: true
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: ".bun-version"
      - name: Install JS dependencies
        run: bun install --frozen-lockfile
      - name: JS unit tests (client controller)
        run: bun test spec/javascript
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: |
            playwright-${{ runner.os }}-
      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: bunx --bun playwright install chromium chromium-headless-shell
      - name: Install Playwright system dependencies
        run: sudo bunx --bun playwright install-deps chromium 2>/dev/null || true
      - name: System specs
        run: bundle exec rspec spec/system
      - name: Upload failure screenshots
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: capybara-screenshots
          path: spec/dummy/tmp/capybara/**/*.png
          if-no-files-found: ignore
