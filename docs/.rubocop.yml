---
plugins:
- rubocop-performance
- rubocop-rails
- rubocop-rspec
- rubocop-capybara
- rubocop-thread_safety
require:
- docs_kit/rubocop
DocsKit/RenderComponentPreferred:
  Enabled: true
  Include:
  - app/**/*.rb
AllCops:
  TargetRubyVersion: 3.4
  NewCops: enable
  SuggestExtensions: false
  Include:
  - app/**/*.rb
  - spec/**/*.rb
  - Rakefile
  - config.ru
  Exclude:
  - bin/**/*
  - db/schema.rb
  - config/**/*
  - node_modules/**/*
  - tmp/**/*
  - vendor/**/*
  - storage/**/*
# Declarative Phlex prose/markup (docs pages, diagram components, demo
# components) reads better on one line than wrapped — a one-line SEO
# `description` or a nav blurb is naturally past 120 chars. Match the house
# style in the sibling apps (cosmos/zazu): raise the cap and exclude the
# view/component trees, where a hard wrap fights the content.
Layout/LineLength:
  Max: 125
  AllowHeredoc: true
  AllowURI: true
  AllowCopDirectives: true
  AllowedPatterns:
  - '\A\s*#\s*'
  Exclude:
  - app/views/**/*
  - app/components/**/*
  - app/reactive_components/**/*
Metrics/MethodLength:
  Exclude:
  - app/views/**/*
  - app/components/**/*
  - app/reactive_components/**/*
Metrics/AbcSize:
  Exclude:
  - app/views/**/*
  - app/components/**/*
  - app/reactive_components/**/*
Metrics/BlockLength:
  Exclude:
  - app/views/**/*
  - app/components/**/*
  - app/reactive_components/**/*
  - spec/**/*
  - config/initializers/**/*
Metrics/ClassLength:
  Exclude:
  - app/views/**/*
  - app/components/**/*
  - app/reactive_components/**/*
Metrics/CyclomaticComplexity:
  Exclude:
  - app/views/**/*
  - app/components/**/*
  - app/reactive_components/**/*
Metrics/PerceivedComplexity:
  Exclude:
  - app/views/**/*
  - app/components/**/*
  - app/reactive_components/**/*
ThreadSafety/ClassInstanceVariable:
  Exclude:
  - app/views/docs/page.rb
Lint/MissingSuper:
  Exclude:
  - app/views/**/*
  - app/components/**/*
  - app/reactive_components/**/*
# Short coordinate/builder params (x, y, s) are idiomatic in the SVG diagram
# components — same house-style exclusion cosmos uses for views/components.
Naming/MethodParameterName:
  Exclude:
  - app/views/**/*
  - app/components/**/*
  - app/reactive_components/**/*
Metrics/ParameterLists:
  CountKeywordArgs: false
Rails/FindEach:
  Exclude:
  - app/models/demo.rb
  - app/models/doc.rb
  - app/views/**/*
  - spec/**/*
Style/Documentation:
  Enabled: false
RSpec/ExampleLength:
  Enabled: false
RSpec/MultipleExpectations:
  Enabled: false
RSpec/DescribeClass:
  Enabled: false
inherit_gem:
  docs-kit:
  - config/rubocop/docs_kit.yml
