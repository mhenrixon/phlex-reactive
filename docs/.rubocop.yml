---
plugins:
- rubocop-performance
- rubocop-rails
- rubocop-rspec
- rubocop-capybara
- rubocop-thread_safety
require:
- docs_kit/rubocop
DocsKit/RenderComponentPreferred:
  Enabled: true
  Include:
  - app/**/*.rb
AllCops:
  TargetRubyVersion: 3.4
  NewCops: enable
  SuggestExtensions: false
  Include:
  - app/**/*.rb
  - spec/**/*.rb
  - Rakefile
  - config.ru
  Exclude:
  - bin/**/*
  - db/schema.rb
  - config/**/*
  - node_modules/**/*
  - tmp/**/*
  - vendor/**/*
  - storage/**/*
Metrics/MethodLength:
  Exclude:
  - app/views/**/*
  - app/reactive_components/**/*
Metrics/AbcSize:
  Exclude:
  - app/views/**/*
  - app/reactive_components/**/*
Metrics/BlockLength:
  Exclude:
  - app/views/**/*
  - app/reactive_components/**/*
  - spec/**/*
  - config/initializers/**/*
Metrics/ClassLength:
  Exclude:
  - app/views/**/*
  - app/reactive_components/**/*
ThreadSafety/ClassInstanceVariable:
  Exclude:
  - app/views/docs/page.rb
Lint/MissingSuper:
  Exclude:
  - app/views/**/*
  - app/reactive_components/**/*
Metrics/ParameterLists:
  CountKeywordArgs: false
Rails/FindEach:
  Exclude:
  - app/models/demo.rb
  - app/models/doc.rb
  - app/views/**/*
  - spec/**/*
Style/Documentation:
  Enabled: false
RSpec/ExampleLength:
  Enabled: false
RSpec/MultipleExpectations:
  Enabled: false
RSpec/DescribeClass:
  Enabled: false
inherit_gem:
  docs-kit:
  - config/rubocop/docs_kit.yml
