<svg width="600" height="600" viewBox="0 0 600 600" xmlns="http://www.w3.org/2000/svg" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#12171d"/>
      <stop offset="0.55" stop-color="#1d232a"/>
      <stop offset="1" stop-color="#0e1116"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7c5cff"/>
      <stop offset="0.5" stop-color="#4f8cff"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
    <linearGradient id="accentText" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#a78bfa"/>
      <stop offset="0.5" stop-color="#60a5fa"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.32" r="0.75">
      <stop offset="0" stop-color="#4f8cff" stop-opacity="0.30"/>
      <stop offset="1" stop-color="#4f8cff" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
  </defs>

  <rect width="600" height="600" fill="url(#bg)"/>
  <rect width="600" height="600" fill="url(#glow)"/>
  <rect x="0" y="0" width="600" height="6" fill="url(#accent)"/>

  <!-- centered brand mark -->
  <g transform="translate(268 150)">
    <rect x="-10" y="-10" width="104" height="104" rx="24" transform="rotate(45 42 42)" fill="url(#accent)" filter="url(#soft)" opacity="0.55"/>
    <rect x="0" y="0" width="84" height="84" rx="20" transform="rotate(45 42 42)" fill="url(#accent)"/>
    <rect x="24" y="24" width="36" height="36" rx="9" transform="rotate(45 42 42)" fill="#12171d"/>
  </g>

  <text x="300" y="360" text-anchor="middle" font-size="44" font-weight="800" fill="#f4f7fb" letter-spacing="-0.5">phlex-reactive</text>
  <text x="300" y="410" text-anchor="middle" font-size="26" font-weight="600" fill="url(#accentText)">Reactive Phlex for Rails</text>
  <text x="300" y="470" text-anchor="middle" font-size="21" font-weight="400" fill="#aeb9c6">Live cross-tab updates, no bespoke JS</text>

  <!-- small fan-out motif -->
  <g stroke="#4f8cff" stroke-opacity="0.4" stroke-width="2" fill="none" transform="translate(300 528)">
    <path d="M0 0 L-70 20"/><path d="M0 0 L-24 24"/><path d="M0 0 L24 24"/><path d="M0 0 L70 20"/>
  </g>
  <g fill="#60a5fa" transform="translate(300 528)">
    <circle cx="0" cy="0" r="6"/>
    <circle cx="-70" cy="20" r="5" fill="#a78bfa"/><circle cx="-24" cy="24" r="5"/>
    <circle cx="24" cy="24" r="5"/><circle cx="70" cy="20" r="5" fill="#22d3ee"/>
  </g>
</svg>
