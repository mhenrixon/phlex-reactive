# dash deploy for the phlex-reactive docs site → the oss-infrastructure server.
# Routing is via kamal-proxy behind a Cloudflare Tunnel (no Traefik; TLS is
# terminated at the Cloudflare edge), per oss-infrastructure/docs/adding-a-new-gem.md.
service: phlex-reactive
# Match the repo (ghcr.io/zoolutions/phlex-reactive) so GitHub auto-links the
# package to this repo and the Actions GITHUB_TOKEN can push to it. A package
# named differently from the repo stays user-owned + unlinked → push 403s in CI.
image: zoolutions/phlex-reactive

# dash 4 renamed the on-host proxy (kamal-proxy → dash-proxy) and migrates a
# host in place; an older CLI must not deploy this config.
minimum_version: 4.0.0

# A stateless docs site never rolls back far — keep the host tidy.
retain_containers: 2

# Status-named pages (public/502.html, 503, 504) the proxy serves in place of
# the app's during a deploy gap — paired with `proxy.intercept_errors` below.
error_pages_path: public

servers:
  web:
    - <%= ENV["DEPLOY_HOST"] %>

# The server's deploy user is `oss` (a sudo, docker-group user; there is no root
# SSH). dash defaults to root, so this MUST be set or the deploy can't connect.
ssh:
  user: <%= ENV.fetch("DEPLOY_SSH_USER", "oss") %>

# dash puts the app AND accessories on the auto-created `kamal` Docker network,
# so the app reaches the postgres accessory by its container name
# (phlex-reactive-postgres) with no manual network config — see DATABASE_URL.

# kamal-proxy routes by host; TLS is at the Cloudflare edge, so ssl: false.
proxy:
  host: <%= ENV["DEPLOY_DOMAIN"] %>
  app_port: 3000
  # TLS terminates at Cloudflare; the tunnel reaches the proxy over plain HTTP.
  ssl: false
  healthcheck:
    path: /up
    interval: 5
    timeout: 30

  # --- dash-proxy per-app features ------------------------------------------
  # zstd / br / gzip negotiated at the edge; responses the app already encoded
  # (Thruster) pass through untouched.
  compress: true

  # RFC 9111 shared cache. Only responses the app marks `Cache-Control: public,
  # max-age` are stored (Propshaft assets, /llms*.txt) — HTML carrying a session
  # cookie is refused by design. `dash proxy cache stats` shows what it holds.
  cache:
    enabled: true
    max_ttl: 300

  # Security headers set once here instead of per app; drop server fingerprints.
  headers:
    response:
      set:
        X-Content-Type-Options: nosniff
        Referrer-Policy: strict-origin-when-cross-origin
      remove:
        - Server
        - X-Powered-By

  # Serve public/<status>.html instead of a bare "Bad Gateway" while a
  # container is swapped or unhealthy.
  intercept_errors:
    - 502
    - 503
    - 504

  # Keep the health probe out of the request histograms.
  exclude_metrics_paths:
    - /up

registry:
  server: ghcr.io
  username: mhenrixon
  password:
    - DASH_REGISTRY_PASSWORD

# The build context is the REPO ROOT (gem + app, since the app depends on the gem
# via path: ".."). Run kamal from docs/, so `dockerfile` is relative to docs/
# (just "Dockerfile") and `context: ..` points the build at the repo root.
builder:
  arch: amd64
  context: ..
  dockerfile: Dockerfile

env:
  clear:
    RAILS_SERVE_STATIC_FILES: "true"
    RAILS_LOG_TO_STDOUT: "true"
    # This is a throwaway demo site with NO real secrets: the DB is seeded
    # todos/chat reachable only over the internal Docker network (behind SSH + the
    # Cloudflare Tunnel), and the app reads no Rails encrypted credentials. So
    # SECRET_KEY_BASE (used to sign cookies AND phlex-reactive's identity tokens)
    # and the DB password are inline rather than managed secrets — no master key,
    # no 1Password needed. Rotate here if ever required.
    SECRET_KEY_BASE: "b9155e47dce1f0bb6c653eeef87d02fc8ce3b77210338903c74a82c17f8959e442c13d3072f56ac5c074aa498909e34236f0e22c38ccb6f529c97d90a5dc6049"
    DATABASE_URL: "postgres://phlex_reactive:49aefea6368f231f568fc7efcdd1aa19c72f19314610983d@phlex-reactive-postgres:5432/phlex_reactive_docs_production"

# Postgres 18 + PGMQ — the transport the deployed site dogfoods via pgbus.
accessories:
  postgres:
    image: ghcr.io/pgmq/pg18-pgmq:v1.11.1
    host: <%= ENV["DEPLOY_HOST"] %>
    port: "127.0.0.1:5432:5432"
    env:
      clear:
        POSTGRES_USER: phlex_reactive
        POSTGRES_DB: phlex_reactive_docs_production
        # Inline (throwaway demo DB) — must match DATABASE_URL above.
        POSTGRES_PASSWORD: "49aefea6368f231f568fc7efcdd1aa19c72f19314610983d"
    # PG18 stores its cluster at $PGDATA = /var/lib/postgresql/18/docker (a
    # version-specific subdir), and the image REFUSES to boot if a volume is
    # mounted at the legacy /var/lib/postgresql/data path. Mount the parent
    # /var/lib/postgresql so PGDATA persists inside it. See docker-library/postgres#1259.
    directories:
      - data:/var/lib/postgresql
