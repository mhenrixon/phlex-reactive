# Kamal deploy for the phlex-reactive docs site → the oss-infrastructure server.
# Routing is via kamal-proxy behind a Cloudflare Tunnel (no Traefik; TLS is
# terminated at the Cloudflare edge), per oss-infrastructure/docs/adding-a-new-gem.md.
service: phlex-reactive-docs
image: mhenrixon/phlex-reactive-docs

servers:
  web:
    - <%= ENV["DEPLOY_HOST"] %>

# The server's deploy user is `oss` (a sudo, docker-group user; there is no root
# SSH). Kamal defaults to root, so this MUST be set or the deploy can't connect.
ssh:
  user: <%= ENV.fetch("DEPLOY_SSH_USER", "oss") %>

# Kamal puts the app AND accessories on the auto-created `kamal` Docker network,
# so the app reaches the postgres accessory by its container name
# (phlex-reactive-docs-postgres) with no manual network config — see DATABASE_URL.

# kamal-proxy routes by host; TLS is at the Cloudflare edge, so ssl: false.
proxy:
  host: <%= ENV["DEPLOY_DOMAIN"] %>
  app_port: 3000
  ssl: false
  healthcheck:
    path: /up
    interval: 5
    timeout: 30

registry:
  server: ghcr.io
  username: mhenrixon
  password:
    - KAMAL_REGISTRY_PASSWORD

# The build context is the REPO ROOT (gem + app, since the app depends on the gem
# via path: ".."). Run kamal from docs/, so `dockerfile` is relative to docs/
# (just "Dockerfile") and `context: ..` points the build at the repo root.
builder:
  arch: amd64
  context: ..
  dockerfile: Dockerfile

env:
  clear:
    RAILS_SERVE_STATIC_FILES: "true"
    RAILS_LOG_TO_STDOUT: "true"
    # This is a throwaway demo site with NO real secrets: the DB is seeded
    # todos/chat reachable only over the internal Docker network (behind SSH + the
    # Cloudflare Tunnel), and the app reads no Rails encrypted credentials. So
    # SECRET_KEY_BASE (used to sign cookies AND phlex-reactive's identity tokens)
    # and the DB password are inline rather than managed secrets — no master key,
    # no 1Password needed. Rotate here if ever required.
    SECRET_KEY_BASE: "7c4883791c11038674b9ecb2b4f4efab57e2e63d0d7b8e75834ae752e247014dfa52e415272e8c45929b6caf74986881e78fc4ddd9ebebcd591df0d75c58e19c"
    DATABASE_URL: "postgres://phlex_reactive:49aefea6368f231f568fc7efcdd1aa19c72f19314610983d@phlex-reactive-docs-postgres:5432/phlex_reactive_docs_production"

# Postgres 18 + PGMQ — the transport the deployed site dogfoods via pgbus.
accessories:
  postgres:
    image: ghcr.io/pgmq/pg18-pgmq:v1.11.1
    host: <%= ENV["DEPLOY_HOST"] %>
    port: "127.0.0.1:5432:5432"
    env:
      clear:
        POSTGRES_USER: phlex_reactive
        POSTGRES_DB: phlex_reactive_docs_production
        # Inline (throwaway demo DB) — must match DATABASE_URL above.
        POSTGRES_PASSWORD: "49aefea6368f231f568fc7efcdd1aa19c72f19314610983d"
    directories:
      - data:/var/lib/postgresql/data
