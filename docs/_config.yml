title: phlex-reactive
description: >-
  Reactive Phlex components for Rails — Livewire-style actions and live
  cross-tab updates, without writing Stimulus controllers or hand-picking
  Turbo Stream targets.
remote_theme: just-the-docs/just-the-docs
url: https://mhenrixon.github.io
baseurl: /phlex-reactive

# Just the Docs settings
search_enabled: true
heading_anchors: true
color_scheme: dark

aux_links:
  GitHub: https://github.com/mhenrixon/phlex-reactive
  RubyGems: https://rubygems.org/gems/phlex-reactive

aux_links_new_tab: true

callouts:
  warning:
    title: Warning
    color: red
  note:
    title: Note
    color: blue

plugins:
  - jekyll-remote-theme

# Files that aren't site pages.
exclude:
  - Gemfile
  - Gemfile.lock
  - vendor
